name: iOS build probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-probe.yml'

jobs:
  probe:
    runs-on: macos-14
    env:
      IOS_TRIPLE: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Toolchain facts
        run: |
          xcodebuild -version || true
          rustc -vV

      - name: Build the frontend (generate_context! needs dist)
        run: |
          npm ci
          npm run build

      - name: Placeholder sidecars so tauri_build passes (iOS cannot spawn these anyway)
        run: |
          mkdir -p src-tauri/binaries
          for name in mihomo whispera-go-client; do
            : > "src-tauri/binaries/${name}-${IOS_TRIPLE}"
          done
          ls -la src-tauri/binaries

      - name: Compile the Rust lib for iOS
        id: libbuild
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --manifest-path src-tauri/Cargo.toml --lib \
            --target "$IOS_TRIPLE" 2>&1 | tee "$RUNNER_TEMP/ios-lib.log"

      - name: Summarise compile errors
        if: always()
        run: |
          echo "lib build outcome: ${{ steps.libbuild.outcome }}"
          LOG="$RUNNER_TEMP/ios-lib.log"
          [ -f "$LOG" ] || { echo "no log"; exit 0; }
          echo "=== error count: $(grep -cE '^error' "$LOG" || echo 0) ==="
          echo "=== distinct error headlines ==="
          grep -E '^error' "$LOG" | sort | uniq -c | sort -rn | head -40 || true
          echo "=== first 60 error+location lines ==="
          grep -nE '^error|^\s*-->' "$LOG" | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-probe-log
          path: ${{ runner.temp }}/ios-lib.log
