name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'

jobs:
  ipa:
    runs-on: macos-14
    env:
      IOS_TRIPLE: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend + placeholder sidecars
        run: |
          npm ci
          npm run build
          mkdir -p src-tauri/binaries
          for name in mihomo whispera-go-client; do
            : > "src-tauri/binaries/${name}-${IOS_TRIPLE}"
          done

      - name: tauri ios init
        id: init
        continue-on-error: true
        run: |
          set -o pipefail
          npx tauri ios init --ci 2>&1 | tee "$RUNNER_TEMP/init.log"
          echo "--- gen/apple:"; ls -la src-tauri/gen/apple 2>&1 | head -40 || true

      - name: Inspect the Xcode project
        if: always()
        continue-on-error: true
        run: |
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj 2>/dev/null | head -1)
          echo "project: $PROJ"
          [ -n "$PROJ" ] && xcodebuild -list -project "$PROJ" 2>&1 | tee "$RUNNER_TEMP/schemes.log" || echo "no project"

      - name: Build via tauri (sets up the Rust build phase), unsigned
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj 2>/dev/null | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "project: $PROJ  scheme: $SCHEME"
          # build (not archive) with signing off: builds the .app without a team
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release \
            -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/dd" build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -30

      - name: Package unsigned .ipa
        if: always()
        continue-on-error: true
        run: |
          APP=$(find "$RUNNER_TEMP/dd" src-tauri/gen/apple -name '*.app' -path '*iphoneos*' 2>/dev/null | head -1)
          [ -z "$APP" ] && APP=$(find "$RUNNER_TEMP/dd" src-tauri/gen/apple -name '*.app' 2>/dev/null | head -1)
          echo "app: $APP"
          if [ -n "$APP" ]; then
            mkdir -p "$RUNNER_TEMP/Payload"
            cp -R "$APP" "$RUNNER_TEMP/Payload/"
            (cd "$RUNNER_TEMP" && zip -qr Whisp-unsigned.ipa Payload)
            ls -la "$RUNNER_TEMP/Whisp-unsigned.ipa"
          else
            echo "no .app produced"
          fi

      - name: Annotate logs
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/init.log" "$RUNNER_TEMP/schemes.log" "$RUNNER_TEMP/build.log" <<'PY'
          import sys
          out = ""
          for p in sys.argv[1:]:
              try:
                  t = open(p, errors="replace").read()
              except OSError:
                  continue
              errs = [l for l in t.splitlines() if any(k in l for k in ("error:", "error ", "fatal", "No such", "not found", "requires a provisioning", "Signing", "Command ", "** BUILD"))]
              tail = "\n".join(errs[-40:]) or t[-4000:]
              out += f"--- {p}\n{tail}\n"
          for a,b in (("%","%25"),("\r","%0D"),("\n","%0A")):
              out = out.replace(a,b)
          print("::error title=ios build::" + out)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: |
            ${{ runner.temp }}/Whisp-unsigned.ipa
            ${{ runner.temp }}/*.log
