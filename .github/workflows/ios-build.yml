name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'

jobs:
  ipa:
    runs-on: macos-14
    env:
      IOS_TRIPLE: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Select the newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "available: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')"
          [ -n "$LATEST" ] && sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Frontend + placeholder sidecars
        run: |
          npm ci
          npm run build
          mkdir -p src-tauri/binaries
          for n in mihomo whispera-go-client; do : > "src-tauri/binaries/${n}-${IOS_TRIPLE}"; done

      - name: tauri ios init
        run: npx tauri ios init --ci 2>&1 | tee "$RUNNER_TEMP/init.log" | tail -15

      - name: What was generated
        run: |
          echo "=== gen/apple ==="; ls -laR src-tauri/gen/apple 2>&1 | head -50
          WS=$(ls -d src-tauri/gen/apple/*.xcworkspace 2>/dev/null | head -1)
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj 2>/dev/null | head -1)
          echo "workspace=[$WS] project=[$PROJ]"
          { [ -n "$WS" ] && xcodebuild -list -workspace "$WS"; } 2>&1 | tee "$RUNNER_TEMP/schemes.log" || true
          [ -z "$WS" ] && xcodebuild -list -project "$PROJ" 2>&1 | tee "$RUNNER_TEMP/schemes.log" || true

      - name: Build unsigned via tauri (--no-sign)
        id: build
        continue-on-error: true
        run: |
          npx tauri ios build --ci --no-sign 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -50

      - name: Collect the .ipa (or package the .app)
        if: always()
        run: |
          echo "=== products under gen/apple ==="
          find src-tauri/gen/apple -name '*.ipa' -o -name '*.app' 2>/dev/null | head
          IPA=$(find src-tauri/gen/apple -name '*.ipa' 2>/dev/null | head -1)
          if [ -n "$IPA" ]; then
            cp "$IPA" "$RUNNER_TEMP/Whisp-unsigned.ipa"; echo "ipa: $IPA"
          else
            APP=$(find src-tauri/gen/apple -name '*.app' -path '*iphoneos*' 2>/dev/null | head -1)
            [ -z "$APP" ] && APP=$(find src-tauri/gen/apple -name '*.app' 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              mkdir -p "$RUNNER_TEMP/Payload"; cp -R "$APP" "$RUNNER_TEMP/Payload/"
              (cd "$RUNNER_TEMP" && zip -qr Whisp-unsigned.ipa Payload); echo "packaged from: $APP"
            else
              echo "no .app or .ipa produced"
            fi
          fi
          ls -la "$RUNNER_TEMP"/*.ipa 2>/dev/null || true

      - name: Annotate logs
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/schemes.log" "$RUNNER_TEMP/build.log" <<'PY'
          import sys, re
          out = ""
          for p in sys.argv[1:]:
              try: t = open(p, errors="replace").read()
              except OSError: continue
              t = re.sub(r"\x1b\[[0-9;]*m", "", t)
              errs = [l for l in t.splitlines() if any(k in l for k in ("error", "Error", "fatal", "Unable", "No such", "requires a provisioning", "Signing", "** BUILD", "Finished"))]
              out += f"--- {p}\n" + ("\n".join(errs[-50:]) or t[-4000:]) + "\n"
          for a,b in (("%","%25"),("\r","%0D"),("\n","%0A")): out = out.replace(a,b)
          print("::error title=ios build::" + out[:9000])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: |
            ${{ runner.temp }}/*.ipa
            ${{ runner.temp }}/*.log

  screenshot:
    runs-on: macos-14
    env:
      SIM_TRIPLE: aarch64-apple-ios-sim
      BUNDLE_ID: com.whispera.whisp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Select the newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$LATEST" ] && sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Frontend + placeholder sidecars
        run: |
          npm ci
          npm run build
          mkdir -p src-tauri/binaries
          for n in mihomo whispera-go-client; do : > "src-tauri/binaries/${n}-${SIM_TRIPLE}"; done

      - name: tauri ios init
        run: npx tauri ios init --ci 2>&1 | tail -15

      - name: Build for the simulator
        id: simbuild
        continue-on-error: true
        run: |
          npx tauri ios build --ci --no-sign --target aarch64-apple-ios-sim 2>&1 | tee "$RUNNER_TEMP/simbuild.log" | tail -50
          echo "=== .app under gen/apple ==="
          find src-tauri/gen/apple -name '*.app' 2>/dev/null | head

      - name: Boot, install, launch, screenshot
        continue-on-error: true
        run: |
          APP=$(find src-tauri/gen/apple -name '*.app' -path '*simulator*' 2>/dev/null | head -1)
          [ -z "$APP" ] && APP=$(find src-tauri/gen/apple -name '*.app' 2>/dev/null | head -1)
          echo "app: $APP"; test -n "$APP"
          DEV=$(xcrun simctl create probe "iPhone 15" 2>/dev/null || xcrun simctl list devices available | grep -oE '[0-9A-F-]{36}' | head -1)
          echo "device: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" "$BUNDLE_ID" || true
          sleep 12
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/whisp-ios.png"
          ls -la "$RUNNER_TEMP/whisp-ios.png"

      - name: Annotate
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/schemes.log" "$RUNNER_TEMP/simbuild.log" <<'PY'
          import sys, re
          out = ""
          for p in sys.argv[1:]:
              try: t = re.sub(r"\x1b\[[0-9;]*m","",open(p,errors="replace").read())
              except OSError: out += f"--- {p}: missing\n"; continue
              errs=[l for l in t.splitlines() if any(k in l for k in ("error","Error","Unable","** BUILD","fatal"))]
              out += f"--- {p}\n" + ("\n".join(errs[-40:]) or t[-3000:]) + "\n"
          for a,b in (("%","%25"),("\r","%0D"),("\n","%0A")): out=out.replace(a,b)
          print("::error title=ios simulator::" + out[:9000])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshot
          path: |
            ${{ runner.temp }}/whisp-ios.png
            ${{ runner.temp }}/*.log
